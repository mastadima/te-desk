name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - ".github/workflows/windows-build.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish Windows/TEDesk.Windows/TEDesk.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output Windows/dist

      - name: Package app
        run: Compress-Archive -Path Windows/dist/* -DestinationPath TE-Desk-windows-x64.zip
        shell: pwsh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TE-Desk-windows-x64
          path: TE-Desk-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
